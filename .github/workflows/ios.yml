name: iOS Build

# Manual only, on purpose.
#
# Xcode on the developer's Mac is the build and test of record for this app:
# it is what produces the TestFlight archive, and it typechecks the whole
# target on every run. This workflow duplicated that on a macOS runner, which
# GitHub bills at roughly 10x a Linux one, on every push AND every pull
# request — and with no timeout, so three infra-stalled runs burned ~15 minutes
# of macOS time each before being killed.
#
# `workflow_dispatch` keeps it available for the cases a local build cannot
# cover — a clean-room build from a fresh checkout, or confirming a change made
# by someone without a Mac — without spending anything the rest of the time.
# Run it from the Actions tab, or: gh workflow run ios.yml
on:
  workflow_dispatch:

# A second manual run supersedes the first rather than paying for both.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build default scheme using any available iPhone simulator
    # Caps a stalled run. A healthy build here takes ~90 seconds; the runs that
    # hung were killed by infra at 15 minutes, which on a macOS runner is the
    # single most expensive thing this workflow has ever done.
    timeout-minutes: 12
    # `macos-latest` is the macOS 26 image, which only carries Xcode 26.x and
    # iOS SDKs 26.0-26.5. The iPhone Duo APIs (ArrangementView, ReservedRegion)
    # are iOS 27.1, so this needs the Xcode 27 image, where Xcode 27.1 is the
    # default and the iOS 27.1 / iPhone Duo simulator is installed.
    runs-on: xcode-27
    defaults:
      run:
        working-directory: FusionTelecomsSignoff

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pinned rather than `latest-stable`: the Xcode 27 image also ships a
      # 27.2 Release Candidate, and the app targets the 27.1 SDK.
      - name: Select Xcode 27.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27.1'

      - name: Show build environment
        run: |
          xcodebuild -version
          echo "--- iOS SDKs ---"
          xcodebuild -showsdks | grep -i ios || true

      - name: Set Default Scheme
        run: |
          scheme_list=$(xcodebuild -list -json | tr -d "\n")
          default=$(echo $scheme_list | ruby -e "require 'json'; puts JSON.parse(STDIN.gets)['project']['targets'][0]")
          echo $default | cat >default
          echo Using default scheme: $default

      - name: Build
        env:
          scheme: ${{ 'default' }}
        run: |
          if [ $scheme = default ]; then scheme=$(cat default); fi
          if [ "`ls -A | grep -i \\.xcworkspace\$`" ]; then filetype_parameter="workspace" && file_to_build="`ls -A | grep -i \\.xcworkspace\$`"; else filetype_parameter="project" && file_to_build="`ls -A | grep -i \\.xcodeproj\$`"; fi
          file_to_build=`echo $file_to_build | awk '{$1=$1;print}'`
          xcodebuild build -scheme "$scheme" -"$filetype_parameter" "$file_to_build" -destination "generic/platform=iOS Simulator" -derivedDataPath build CODE_SIGNING_ALLOWED=NO

      - name: Verify built app has a bundle identifier
        run: |
          # `xcodebuild build` links the app but never installs it, so a missing
          # CFBundleIdentifier only surfaces at install/run time. Assert it here
          # so a broken Info.plist can't merge green again.
          app=$(find build/Build/Products -maxdepth 2 -name "*.app" | head -1)
          if [ -z "$app" ]; then echo "No .app produced by build"; exit 1; fi
          bid=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$app/Info.plist" 2>/dev/null || true)
          echo "Built app: $app"
          echo "CFBundleIdentifier: '$bid'"
          if [ -z "$bid" ]; then
            echo "::error::Built app is missing CFBundleIdentifier — it would fail to install on a device/simulator."
            exit 1
          fi
